name: CI

# jvscribe — projeto Python. O runtime de inferência em Rust foi removido em 2026-07-30
# (decisão do dono: foco de time e colaboração de cientistas de dados). O motor arquivado
# está recuperável em `git switch -c rust-restore rust-runtime-archive-v0.8.0`.
#
# Dois jobs, deliberadamente separados: o obrigatório NUNCA depende de artefato de modelo,
# porque artefato ausente degradando em `skip` silencioso é falso verde. Separar por job faz
# a distinção "não exercitado" vs "aprovado" ser estrutural, não um relatório à parte.

on:
  push:
    branches: [workspace, develop, main]
  pull_request:
    branches: [develop, main]

jobs:
  # ---------------------------------------------------------------------------
  # OBRIGATÓRIO — runner limpo, zero artefato de modelo. Falhar aqui bloqueia o merge.
  # ---------------------------------------------------------------------------
  test-model-free:
    name: testes sem artefato (obrigatório)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      # `pulseaudio-utils` traz `parec`/`pactl`, usados pela captura dual
      # (`jvscribe/realtime/dual_capture.py`). Sem eles os testes de captura fazem skip
      # explícito em vez de falhar — o container de CI não tem servidor de áudio.
      - name: Dependências de sistema
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq pulseaudio-utils ffmpeg

      # venv, não pip global: distribuições recentes marcam o Python do sistema como
      # externally-managed (PEP 668) e recusam a instalação.
      - name: Ambiente Python
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install --quiet --upgrade pip
          .venv/bin/python -m pip install --quiet -r requirements-test.txt

      - name: Testes
        run: .venv/bin/python -m pytest jvscribe/tests -q

      # Torna VISÍVEL quantos testes não exercitaram nada por falta de ambiente. Um número
      # de skips que sobe sem explicação é regressão de cobertura disfarçada de build verde.
      - name: Relatório de skips
        run: |
          .venv/bin/python -m pytest jvscribe/tests -q -rs 2>&1 | tail -25

  # ---------------------------------------------------------------------------
  # CONDICIONAL — exercita o que exige o modelo real. Sua ausência nunca pinta o
  # build de verde, porque o job obrigatório acima é independente dele.
  # ---------------------------------------------------------------------------
  test-with-artifact:
    name: testes com artefato de modelo (condicional)
    runs-on: ubuntu-latest
    needs: test-model-free
    if: ${{ vars.JVSCRIBE_ARTIFACT_URL != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Dependências de sistema
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq pulseaudio-utils ffmpeg

      - name: Ambiente Python
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install --quiet --upgrade pip
          .venv/bin/python -m pip install --quiet -r requirements-test.txt

      - name: Obter o artefato de modelo
        env:
          ARTIFACT_URL: ${{ vars.JVSCRIBE_ARTIFACT_URL }}
        run: |
          mkdir -p models/ci-artifact
          curl -fsSL "$ARTIFACT_URL" -o /tmp/artifact.tgz
          tar xzf /tmp/artifact.tgz -C models/ci-artifact --strip-components=1

      # Valida a IDENTIDADE do vocabulário antes de medir qualquer coisa: cardinalidade não
      # distingue dois artefatos de 500 tokens com 492 ids divergentes (M9).
      - name: Validar o par (modelo, vocabulário)
        run: .venv/bin/python jvscribe/common/make_model_card.py models/ci-artifact

      - name: Transcrição de ponta a ponta
        run: |
          mkdir -p /tmp/ci-audio /tmp/ci-out
          test -f models/ci-artifact/_eval_wavs/a000.wav \
            && cp models/ci-artifact/_eval_wavs/a000.wav /tmp/ci-audio/
          # Sem `cd`: o script resolve modelo e tokens pelo artefato canônico
          # (JVSCRIBE_MODEL_DIR > models/current > cwd).
          JVSCRIBE_MODEL_DIR="$PWD/models/ci-artifact" \
            .venv/bin/python jvscribe/batch/batch_transcribe.py \
              --input-dir /tmp/ci-audio --out-dir /tmp/ci-out --threads 2
