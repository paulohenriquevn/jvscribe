# Toolchain fixada (M9/T2.4).
#
# 1.88 NÃO é um número escolhido: é o piso real, medido. O `Cargo.toml` do workspace declarava
# `rust-version = "1.75"`, mas o projeto NUNCA buildou com 1.75 — buildava com o rustc da
# máquina. Fixar em 1.75 quebrou o build na hora, com a mensagem exata:
#
#   error: failed to download `ort v2.0.0-rc.12`
#   feature `edition2024` is required ... not stabilized in this version of Cargo (1.75.0)
#
# A dependência `ort 2.0.0-rc.12` declara `edition = "2024"` e `rust-version = "1.88"`
# (registry/src/.../ort-2.0.0-rc.12/Cargo.toml:13-14). Logo o MSRV verdadeiro do workspace é
# 1.88, e o valor anterior era uma afirmação não verificada.
[toolchain]
channel = "1.88"
components = ["rustfmt", "clippy"]
